<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK SEARCH - The Web3 Search Engine</title>
    <meta name="theme-color" content="#111">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #050505; color: #ccc; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        
        /* HEADER CSS */
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: rgba(5, 5, 5, 0.95); border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px); }
        .logo-text { font-size: 24px; color: #e6c875; font-weight: 900; font-family: 'Playfair Display', serif; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        
        /* SEARCH CONTAINER CSS */
        .search-container { padding: 120px 20px 50px 20px; max-width: 800px; margin: 0 auto; text-align: center; min-height: 70vh; }
        .search-container h1 { color: #fff; font-size: 40px; margin-bottom: 5px; font-family: 'Playfair Display', serif; }
        .search-container h1 span { color: #e6c875; }
        .search-tagline { color: #888; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        
        .earn-badge { display: inline-block; background: rgba(37, 211, 102, 0.1); border: 1px solid #25d366; color: #25d366; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 30px; }

        /* GOOGLE SEARCH CUSTOMIZATION FOR DARK THEME */
        .gcse-wrapper { text-align: left; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .back-btn { display: inline-block; margin-top: 30px; padding: 10px 25px; background: transparent; color: #e6c875; border: 1px solid #e6c875; border-radius: 30px; text-decoration: none; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;}
        .back-btn:hover { background: #e6c875; color: #000; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-text">
            <i class="fas fa-search"></i> DK SEARCH
        </a>
    </header>

    <div class="search-container">
        <h1>DK <span>SEARCH</span></h1>
        <p class="search-tagline">The Next-Gen Web3 Search Engine</p>
        
        <div class="earn-badge">
            <i class="fas fa-gift"></i> Search the Web & Earn ATVT Coins
        </div>

        <div class="gcse-wrapper">
            <!-- GOOGLE SEARCH BAR KA CODE YAHAN AAYEGA -->
            <script async src="https://cse.google.com/cse.js?cx=YOUR_SEARCH_ENGINE_ID"></script>
            <div class="gcse-search"></div>
        </div>

        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

</body>
</html>
