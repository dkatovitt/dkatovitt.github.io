<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Portal Login | DK Atovitt Production House</title>
    
    <meta name="theme-color" content="#111">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 🔥 CORE & BACKGROUND CSS 🔥 */
        body { 
            margin: 0; 
            padding: 0; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); 
            color: #ccc; 
            font-family: Arial, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle cinematic light effect in background */
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(230,200,117,0.03) 0%, transparent 60%);
            animation: pulse-light 10s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes pulse-light {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* 🔥 MAIN AUTHENTICATION BOX 🔥 */
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
            position: relative;
        }

        .auth-card {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            border: 1.5px solid #333;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(230,200,117,0.05);
            transition: 0.3s;
        }
        .auth-card:hover {
            border-color: rgba(230,200,117,0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(230,200,117,0.1);
        }

        /* 🔥 BRANDING HEADER 🔥 */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-header video {
            width: 80px;
            height: 80px;
            object-fit: contain;
            mix-blend-mode: screen;
            transform: scale(1.4);
            margin-bottom: -5px;
        }
        .brand-header h1 {
            color: #e6c875;
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .brand-header p {
            color: #888;
            font-size: 11px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }

        /* 🔥 TABS (LOGIN / SIGNUP) 🔥 */
        .auth-tabs {
            display: flex;
            background: #000;
            border-radius: 30px;
            border: 1px solid #333;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 12px 0;
            background: transparent;
            color: #888;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
        .auth-tab-btn.active {
            color: #000;
        }
        .tab-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: #e6c875;
            border-radius: 30px;
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        /* 🔥 FORMS 🔥 */
        .auth-form {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .auth-form.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 16px;
            transition: 0.3s;
        }
        .input-group input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 15px 14px 45px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #e6c875;
            box-shadow: 0 0 10px rgba(230,200,117,0.2);
            background: #1a1a1a;
        }
        .input-group input:focus + i, .input-group input:not(:placeholder-shown) + i {
            color: #e6c875;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #e6c875, #b8860b);
            color: #000;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(230,200,117,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230,200,117,0.5);
            background: linear-gradient(135deg, #f5d784, #cba028);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #333;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .divider span {
            color: #888;
            font-size: 12px;
            font-weight: bold;
            background: #0a0a0a;
            padding: 0 10px;
        }

        .google-btn {
            width: 100%;
            background: #fff;
            color: #333;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn img {
            width: 20px;
        }
        .google-btn:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
        }
        .footer-link a {
            color: #e6c875;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }

        /* 🔥 CUSTOM ALERT MODAL 🔥 */
        .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .custom-alert-overlay.active { display: flex; animation: fadeInModal 0.3s ease; }
        .custom-alert-box { background: #111; border: 1.5px solid #e6c875; width: 90%; max-width: 380px; border-radius: 18px; padding: 35px 25px; text-align: center; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .custom-alert-logo { width: 70px; height: 70px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #333; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(230,200,117,0.3); }
        .custom-alert-logo video { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; transform: scale(1.4); }
        .custom-alert-title { font-size: 20px; font-weight: 900; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px; font-family: 'Playfair Display', serif; }
        .custom-alert-msg { color: #ccc; font-size: 13px; line-height: 1.6; margin-bottom: 25px; }
        .custom-alert-btn { background: #e6c875; color: #000; padding: 10px 30px; border-radius: 30px; font-weight: 900; font-size: 13px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .custom-alert-btn:hover { background: #d4b561; }

        /* LOADER */
        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 1000000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
        #pageLoader video { width: 100px; mix-blend-mode: screen; transform: scale(1.5); margin-bottom: 20px; }
        #pageLoader p { color: #e6c875; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="pageLoader">
        <video src="images/logo/logo.mp4" autoplay loop muted playsinline preload="metadata"></video>
        <p>Securing Casting Portal...</p>
    </div>

    <div class="custom-alert-overlay" id="customAlertOverlay">
        <div class="custom-alert-box">
            <div class="custom-alert-logo">
                <video src="images/logo/logo.mp4" autoplay loop muted playsinline></video>
            </div>
            <h3 class="custom-alert-title" id="customAlertTitle">Alert</h3>
            <p class="custom-alert-msg" id="customAlertMsg">Message</p>
            <button class="custom-alert-btn" id="closeCustomAlert">OK</button>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="brand-header">
                <video src="images/logo/logo.mp4" autoplay loop muted playsinline preload="metadata"></video>
                <h1>DK ATOVITT</h1>
                <p>Official Casting Portal</p>
            </div>

            <div class="auth-tabs">
                <div class="tab-slider" id="tabSlider"></div>
                <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Log In</button>
                <button class="auth-tab-btn" id="tabSignupBtn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder=" " required>
                    <i class="fas fa-envelope"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder=" " required>
                    <i class="fas fa-lock"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Password</label>
                </div>
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="javascript:void(0)" onclick="forgotPassword()" style="color: #aaa; font-size: 12px; text-decoration: none;">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn" id="loginSubmitBtn">
                    Enter Portal <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <form id="signupForm" class="auth-form">
                <div class="input-group">
                    <input type="text" id="signupName" placeholder=" " required>
                    <i class="fas fa-user"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Full Legal Name</label>
                </div>
                <div class="input-group">
                    <input type="email" id="signupEmail" placeholder=" " required>
                    <i class="fas fa-envelope"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder=" " required minlength="6">
                    <i class="fas fa-lock"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Create Password (Min 6)</label>
                </div>
                <button type="submit" class="submit-btn" id="signupSubmitBtn">
                    Create Talent Account <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="divider"><span>OR</span></div>

            <button type="button" class="google-btn" id="googleLoginBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"> 
                Continue with Google
            </button>

            <div class="footer-link">
                <a href="movie.html"><i class="fas fa-arrow-left"></i> Back to Production House</a>
            </div>

        </div>
    </div>

    <script>
        // Floating label logic
        document.querySelectorAll('.input-group input').forEach(input => {
            input.addEventListener('focus', () => {
                input.nextElementSibling.nextElementSibling.style.top = '-8px';
                input.nextElementSibling.nextElementSibling.style.fontSize = '11px';
                input.nextElementSibling.nextElementSibling.style.background = '#111';
                input.nextElementSibling.nextElementSibling.style.padding = '0 5px';
                input.nextElementSibling.nextElementSibling.style.color = '#e6c875';
            });
            input.addEventListener('blur', () => {
                if(input.value === '') {
                    input.nextElementSibling.nextElementSibling.style.top = '14px';
                    input.nextElementSibling.nextElementSibling.style.fontSize = '14px';
                    input.nextElementSibling.nextElementSibling.style.background = 'transparent';
                    input.nextElementSibling.nextElementSibling.style.color = '#888';
                }
            });
        });

        // Tab Switching Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabSlider = document.getElementById('tabSlider');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnSignup = document.getElementById('tabSignupBtn');

            if (tab === 'login') {
                signupForm.classList.remove('active');
                loginForm.classList.add('active');
                tabSlider.style.left = '0%';
                btnSignup.classList.remove('active');
                btnLogin.classList.add('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
                tabSlider.style.left = '50%';
                btnLogin.classList.remove('active');
                btnSignup.classList.add('active');
            }
        }

        // Custom Alert Logic
        function showAlert(title, msg, isError = false) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMsg').innerText = msg;
            document.getElementById('customAlertTitle').style.color = isError ? "#ff4d4d" : "#e6c875";
            document.getElementById('customAlertOverlay').classList.add('active');
        }
        document.getElementById('closeCustomAlert').addEventListener('click', () => {
            document.getElementById('customAlertOverlay').classList.remove('active');
        });

        // Forgot Password Mock
        function forgotPassword() {
            showAlert("Reset Password", "Please use the main DK Atovitt login page (auth.html) to reset your password if forgotten.");
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // DK Atovitt Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAo0NKae4xEElyITxPyzKN0sdDaThyX5PA",
            authDomain: "dk-atovitt.firebaseapp.com",
            projectId: "dk-atovitt",
            storageBucket: "dk-atovitt.firebasestorage.app",
            messagingSenderId: "234274941441",
            appId: "1:234274941441:web:5e029c7ba315f849c3ae00"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // 🛑 CRITICAL LOGIC: Auto-redirect if already logged in!
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is logged in -> Send them straight to the Audition Account Form!
                window.location.replace("auditionaccount.html");
            } else {
                // User is not logged in -> Hide Loader, let them login/signup
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 300);
                }
            }
        });

        // 1. Email Login Process
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginSubmitBtn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    // Success! onAuthStateChanged will auto-redirect to auditionaccount.html
                })
                .catch((error) => {
                    showAlert("Login Failed", "Invalid email or password. Please try again.", true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });

        // 2. Email Signup Process
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;
            const btn = document.getElementById('signupSubmitBtn');
            const originalText = btn.innerHTML;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Profile...';
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    // Update user's name in Firebase Profile
                    updateProfile(userCredential.user, {
                        displayName: name
                    }).then(() => {
                        // Success! onAuthStateChanged will auto-redirect to auditionaccount.html
                    });
                })
                .catch((error) => {
                    let errorMsg = error.message;
                    if (error.code === 'auth/email-already-in-use') errorMsg = "Email is already registered. Please login.";
                    showAlert("Signup Failed", errorMsg, true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });

        // 3. Google Login/Signup Process
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            const btn = document.getElementById('googleLoginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
            btn.disabled = true;

            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    // Success! onAuthStateChanged will auto-redirect to auditionaccount.html
                })
                .catch((error) => {
                    showAlert("Google Login Failed", "Could not connect to Google. Please try again.", true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
