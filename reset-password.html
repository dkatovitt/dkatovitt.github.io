<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DK Atovitt VIP Portal</title>
    
    <meta name="robots" content="noindex, nofollow"> <!-- Security feature -->
    <meta name="theme-color" content="#e6c875">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #050505; color: #ccc; font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; }
        .auth-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: url('images/movies/yakshini-bg.jpg') center/cover no-repeat; position: relative; }
        .auth-section::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 5, 0.90); z-index: 1; }
        
        .auth-box { position: relative; z-index: 2; background: #111; border: 1px solid #e6c875; border-radius: 12px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); text-align: center; }
        
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-video-logo { width: 80px; height: 80px; margin: 0 auto 15px auto; border-radius: 18px; overflow: hidden; background: #000; border: 2px solid #e6c875; box-shadow: 0 5px 15px rgba(230, 200, 117, 0.4); display: flex; align-items: center; justify-content: center; }
        .auth-video-logo video { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; transform: scale(1.4); }
        .auth-header h2 { color: #e6c875; font-size: 26px; margin: 0 0 10px 0; font-family: 'Playfair Display', serif; letter-spacing: 1px; text-transform: uppercase; }
        .auth-header p { color: #aaa; font-size: 14px; margin: 0; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: #ccc; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .form-group input { width: 100%; padding: 14px 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .form-group input:focus { border-color: #e6c875; background: #1a1a1a; box-shadow: 0 0 8px rgba(230, 200, 117, 0.2); }
        
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 45px; } 
        .toggle-password { position: absolute; right: 15px; color: #888; cursor: pointer; z-index: 10; font-size: 16px; transition: 0.3s; }
        .toggle-password:hover { color: #e6c875; }

        .auth-btn { width: 100%; background: #e6c875; color: #000; padding: 14px; border: none; border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 10px; box-shadow: 0 5px 15px rgba(230, 200, 117, 0.3); }
        .auth-btn:hover { background: #d4b561; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(230, 200, 117, 0.4); }

        .auth-switch { text-align: center; margin-top: 25px; color: #888; font-size: 14px; }
        .auth-switch a { color: #e6c875; text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-left: 5px; }
        .auth-switch a:hover { text-decoration: underline; color: #fff; }

        /* Custom Alert CSS */
        .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .custom-alert-overlay.active { display: flex; }
        .custom-alert-box { background: #111; border: 1.5px solid #e6c875; width: 90%; max-width: 380px; border-radius: 18px; padding: 35px 25px; text-align: center; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .custom-alert-logo { width: 75px; height: 75px; margin: 0 auto 20px auto; border-radius: 15px; overflow: hidden; background: #000; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        .custom-alert-logo video { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; transform: scale(1.4); }
        .custom-alert-title { font-size: 22px; font-weight: 900; margin: 0 0 15px 0; text-transform: uppercase; font-family: 'Playfair Display', serif; }
        .custom-alert-title.success { color: #e6c875; }
        .custom-alert-title.error { color: #ff4d4d; }
        .custom-alert-msg { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
        .custom-alert-btn { background: #e6c875; color: #000; padding: 12px 35px; border-radius: 30px; font-weight: 900; font-size: 14px; border: none; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        
        #error-box { display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="custom-alert-overlay" id="customAlertOverlay">
        <div class="custom-alert-box">
            <div class="custom-alert-logo">
                <video src="images/logo/logo.mp4" autoplay loop muted playsinline></video>
            </div>
            <h3 class="custom-alert-title" id="customAlertTitle">Alert</h3>
            <p class="custom-alert-msg" id="customAlertMsg">Message goes here.</p>
            <button class="custom-alert-btn" id="closeCustomAlert">OK</button>
        </div>
    </div>

    <section class="auth-section">
        <!-- Main Form Box -->
        <div class="auth-box" id="reset-box">
            <div class="auth-header">
                <div class="auth-video-logo">
                    <video src="images/logo/logo.mp4" autoplay loop muted playsinline></video>
                </div>
                <h2>Create New Password</h2>
                <p id="userEmailText">Setting password for your VIP Account</p>
            </div>
            
            <form id="reset-password-form">
                <div class="form-group">
                    <label>New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" placeholder="Create a strong password (Min 6 Chars)">
                        <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Repeat your new password">
                        <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn"><i class="fas fa-lock"></i> Update Password</button>
            </form>
            
            <div class="auth-switch">
                Remember your password? <a href="auth.html">Login Here</a>
            </div>
        </div>

        <!-- Error Box (If link is expired/invalid) -->
        <div class="auth-box" id="error-box">
            <div class="auth-header">
                <div class="auth-video-logo" style="border-color: #ff4d4d;">
                    <i class="fas fa-exclamation-triangle" style="color: #ff4d4d; font-size: 40px; margin-top: 20px;"></i>
                </div>
                <h2 style="color: #ff4d4d;">Link Expired</h2>
                <p>This password reset link is invalid or has expired.</p>
            </div>
            <button class="auth-btn" onclick="window.location.href='auth.html'">Go to Login Page</button>
        </div>
    </section>

    <script>
        function togglePasswordVisibility(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            }
        }

        function showCustomAlert(title, message, isError = false) {
            const overlay = document.getElementById('customAlertOverlay');
            const titleEl = document.getElementById('customAlertTitle');
            const msgEl = document.getElementById('customAlertMsg');
            titleEl.innerText = title;
            msgEl.innerText = message;
            titleEl.className = isError ? "custom-alert-title error" : "custom-alert-title success";
            overlay.classList.add('active');
        }

        document.getElementById('closeCustomAlert').addEventListener('click', () => {
            document.getElementById('customAlertOverlay').classList.remove('active');
        });
    </script>

    <!-- FIREBASE PASSWORD RESET LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo0NKae4xEElyITxPyzKN0sdDaThyX5PA",
            authDomain: "dk-atovitt.firebaseapp.com",
            projectId: "dk-atovitt",
            storageBucket: "dk-atovitt.firebasestorage.app",
            messagingSenderId: "234274941441",
            appId: "1:234274941441:web:5e029c7ba315f849c3ae00"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Get OOB Code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');

        const resetBox = document.getElementById('reset-box');
        const errorBox = document.getElementById('error-box');
        const emailText = document.getElementById('userEmailText');

        if (mode !== 'resetPassword' || !oobCode) {
            resetBox.style.display = 'none';
            errorBox.style.display = 'block';
        } else {
            // Verify link and get User's Email
            verifyPasswordResetCode(auth, oobCode).then((email) => {
                emailText.innerText = "For Account: " + email;
            }).catch((error) => {
                resetBox.style.display = 'none';
                errorBox.style.display = 'block';
            });
        }

        // Handle Form Submission
        document.getElementById('reset-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            if(newPassword.length < 6) {
                showCustomAlert("Error", "Password must be at least 6 characters long.", true);
                return;
            }

            if(newPassword !== confirmPassword) {
                showCustomAlert("Mismatch", "Both passwords do not match. Please try again.", true);
                return;
            }

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

            confirmPasswordReset(auth, oobCode, newPassword).then(() => {
                showCustomAlert("Success!", "Your password has been successfully updated. Please login with your new password.", false);
                setTimeout(() => {
                    window.location.href = "auth.html";
                }, 2500);
            }).catch((error) => {
                showCustomAlert("Update Failed", error.message.replace('Firebase: ', ''), true);
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Update Password';
            });
        });
    </script>
</body>
</html>
