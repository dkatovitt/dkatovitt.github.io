<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Portal Login | DK Atovitt Production House</title>
    
    <meta name="theme-color" content="#111">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); color: #ccc; font-family: Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(230,200,117,0.03) 0%, transparent 60%); animation: pulse-light 10s infinite alternate; z-index: 0; pointer-events: none; }
        @keyframes pulse-light { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 1; } }

        .auth-container { width: 100%; max-width: 420px; padding: 20px; z-index: 10; position: relative; }
        .auth-card { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); border: 1.5px solid #333; border-radius: 20px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(230,200,117,0.05); transition: 0.3s; }

        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header video { width: 80px; height: 80px; object-fit: contain; mix-blend-mode: screen; transform: scale(1.4); margin-bottom: -5px; }
        .brand-header h1 { color: #e6c875; font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; margin: 0 0 5px 0; letter-spacing: 2px; text-transform: uppercase; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .brand-header p { color: #888; font-size: 11px; margin: 0; text-transform: uppercase; letter-spacing: 3px; font-weight: bold; }

        .auth-tabs { display: flex; background: #000; border-radius: 30px; border: 1px solid #333; margin-bottom: 25px; overflow: hidden; position: relative; }
        .auth-tab-btn { flex: 1; padding: 12px 0; background: transparent; color: #888; border: none; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; z-index: 2; }
        .auth-tab-btn.active { color: #000; }
        .tab-slider { position: absolute; top: 0; left: 0; width: 50%; height: 100%; background: #e6c875; border-radius: 30px; transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 1; }

        .auth-form { display: none; animation: fadeIn 0.4s ease; }
        .auth-form.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 18px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; font-size: 16px; transition: 0.3s; }
        .input-group input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 14px 15px 14px 45px; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #e6c875; box-shadow: 0 0 10px rgba(230,200,117,0.2); background: #1a1a1a; }
        .input-group input:focus + i, .input-group input:not(:placeholder-shown) + i { color: #e6c875; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 12px; color: #888; }
        .checkbox-group input { accent-color: #e6c875; width: 16px; height: 16px; cursor: pointer; }
        .checkbox-group a { color: #e6c875; text-decoration: none; font-weight: bold; }

        .status-badge { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 20px; display: none; }
        .status-available { background: rgba(37, 211, 102, 0.1); color: #25d366; border: 1px solid #25d366; }
        .status-taken { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d; }

        .submit-btn { width: 100%; background: linear-gradient(135deg, #e6c875, #b8860b); color: #000; padding: 14px; border: none; border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 5px 15px rgba(230,200,117,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(230,200,117,0.5); background: linear-gradient(135deg, #f5d784, #cba028); }

        .form-footer-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 12px; }
        .form-footer-links a { color: #aaa; text-decoration: none; transition: 0.3s; }
        .form-footer-links a:hover { color: #e6c875; }

        .back-link { text-align: center; margin-top: 25px; font-size: 12px; border-top: 1px solid #333; padding-top: 15px; }
        .back-link a { color: #e6c875; text-decoration: none; font-weight: bold; }
        .back-link a:hover { text-decoration: underline; }

        /* 🔥 FORGOT PASSWORD MODAL 🔥 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-overlay.active { display: flex; animation: fadeInModal 0.3s ease; }
        .modal-box { background: #111; border: 1.5px solid #e6c875; width: 90%; max-width: 380px; border-radius: 18px; padding: 30px 25px; text-align: center; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #888; font-size: 22px; cursor: pointer; }
        .modal-close:hover { color: #fff; }
        .modal-box h3 { color: #e6c875; font-size: 20px; margin: 0 0 10px 0; text-transform: uppercase; font-family: 'Playfair Display', serif; }
        .modal-box p { color: #ccc; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        @keyframes fadeInModal { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* LOADER */
        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 1000000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
        #pageLoader video { width: 100px; mix-blend-mode: screen; transform: scale(1.5); margin-bottom: 20px; }
        #pageLoader p { color: #e6c875; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="pageLoader">
        <video src="images/logo/logo.mp4" autoplay loop muted playsinline preload="metadata"></video>
        <p>Securing Casting Portal...</p>
    </div>

    <!-- 🔥 FORGOT PASSWORD POPUP 🔥 -->
    <div class="modal-overlay" id="forgotPassModal">
        <div class="modal-box">
            <button class="modal-close" id="closeForgotModal">&times;</button>
            <i class="fas fa-unlock-alt" style="font-size: 40px; color: #e6c875; margin-bottom: 15px;"></i>
            <h3>Reset Password</h3>
            <p>Apna User ID darj karein. Password reset link aapke registered admin data par bhej diya jayega.</p>
            <form id="forgotPassForm">
                <div class="input-group">
                    <input type="text" id="resetUserId" placeholder=" " required>
                    <i class="fas fa-user"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Enter User ID</label>
                </div>
                <button type="submit" class="submit-btn" id="resetBtn">Send Reset Link <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <!-- 🔥 CUSTOM ALERT POPUP 🔥 -->
    <div class="modal-overlay" id="customAlertOverlay">
        <div class="modal-box">
            <h3 id="customAlertTitle" style="margin-bottom: 15px;">Alert</h3>
            <p id="customAlertMsg" style="margin-bottom: 25px; font-size: 14px;">Message</p>
            <button class="submit-btn" id="closeCustomAlert" style="width: auto; padding: 8px 30px; margin: 0 auto;">OK</button>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="brand-header">
                <video src="images/logo/logo.mp4" autoplay loop muted playsinline preload="metadata"></video>
                <h1>DK ATOVITT</h1>
                <p>Official Casting Portal</p>
            </div>

            <div class="auth-tabs">
                <div class="tab-slider" id="tabSlider"></div>
                <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Log In</button>
                <button class="auth-tab-btn" id="tabSignupBtn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- 🔥 LOGIN FORM 🔥 -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <input type="text" id="loginUserId" placeholder=" " required>
                    <i class="fas fa-user-tag"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">User ID</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder=" " required>
                    <i class="fas fa-lock"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Password</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="loginTc" required>
                    <label for="loginTc">I agree to the <a href="terms.html">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="submit-btn" id="loginSubmitBtn">
                    Login securely <i class="fas fa-arrow-right"></i>
                </button>

                <div class="form-footer-links">
                    <a href="javascript:void(0)" onclick="openForgotModal()">Forgot User ID / Password?</a>
                    <a href="javascript:void(0)" onclick="switchTab('signup')">New Artist? Sign Up</a>
                </div>
            </form>

            <!-- 🔥 SIGNUP FORM 🔥 -->
            <form id="signupForm" class="auth-form">
                
                <div class="input-group">
                    <input type="text" id="signupUserId" placeholder=" " required>
                    <i class="fas fa-user-tag"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Create User ID</label>
                    <span id="userIdStatus" class="status-badge"></span>
                </div>

                <div class="input-group">
                    <input type="text" id="signupName" placeholder=" " required>
                    <i class="fas fa-id-card"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Full Legal Name</label>
                </div>

                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder=" " required minlength="6">
                    <i class="fas fa-lock"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Create Password</label>
                </div>

                <div class="input-group">
                    <input type="password" id="signupConfirmPassword" placeholder=" " required minlength="6">
                    <i class="fas fa-check-circle"></i>
                    <label style="position: absolute; left: 45px; top: 14px; color: #888; font-size: 14px; transition: 0.3s; pointer-events: none;">Confirm Password</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="signupTc" required>
                    <label for="signupTc">I agree to the <a href="terms.html">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="submit-btn" id="signupSubmitBtn">
                    Create Talent Account <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="back-link">
                <a href="auditions.html"><i class="fas fa-arrow-left"></i> Back to Auditions Page</a>
            </div>

        </div>
    </div>

    <!-- 🔥 UI/UX JAVASCRIPT 🔥 -->
    <script>
        // Floating label logic
        document.querySelectorAll('.input-group input').forEach(input => {
            input.addEventListener('focus', () => {
                input.nextElementSibling.nextElementSibling.style.top = '-8px';
                input.nextElementSibling.nextElementSibling.style.fontSize = '11px';
                input.nextElementSibling.nextElementSibling.style.background = '#111';
                input.nextElementSibling.nextElementSibling.style.padding = '0 5px';
                input.nextElementSibling.nextElementSibling.style.color = '#e6c875';
            });
            input.addEventListener('blur', () => {
                if(input.value === '') {
                    input.nextElementSibling.nextElementSibling.style.top = '14px';
                    input.nextElementSibling.nextElementSibling.style.fontSize = '14px';
                    input.nextElementSibling.nextElementSibling.style.background = 'transparent';
                    input.nextElementSibling.nextElementSibling.style.color = '#888';
                }
            });
        });

        // Tab Switching Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabSlider = document.getElementById('tabSlider');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnSignup = document.getElementById('tabSignupBtn');

            if (tab === 'login') {
                signupForm.classList.remove('active');
                loginForm.classList.add('active');
                tabSlider.style.left = '0%';
                btnSignup.classList.remove('active');
                btnLogin.classList.add('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
                tabSlider.style.left = '50%';
                btnLogin.classList.remove('active');
                btnSignup.classList.add('active');
            }
        }

        // Custom Alert Logic
        function showAlert(title, msg, isError = false) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMsg').innerText = msg;
            document.getElementById('customAlertTitle').style.color = isError ? "#ff4d4d" : "#e6c875";
            document.getElementById('customAlertOverlay').classList.add('active');
        }
        document.getElementById('closeCustomAlert').addEventListener('click', () => {
            document.getElementById('customAlertOverlay').classList.remove('active');
        });

        // Forgot Password Modal
        function openForgotModal() {
            document.getElementById('forgotPassModal').classList.add('active');
        }
        document.getElementById('closeForgotModal').addEventListener('click', () => {
            document.getElementById('forgotPassModal').classList.remove('active');
        });

        // User ID Availability Simulation
        const userIdInput = document.getElementById('signupUserId');
        const statusBadge = document.getElementById('userIdStatus');
        
        userIdInput.addEventListener('input', function() {
            let val = this.value.trim().toLowerCase();
            if(val.length < 4) {
                statusBadge.style.display = 'none';
                return;
            }
            statusBadge.style.display = 'block';
            statusBadge.className = 'status-badge'; 
            
            if(val === 'admin' || val === 'dipak' || val === 'user123') {
                statusBadge.innerText = 'Not Available';
                statusBadge.classList.add('status-taken');
            } else {
                statusBadge.innerText = 'Available';
                statusBadge.classList.add('status-available');
            }
        });

        // Forgot Password Submit
        document.getElementById('forgotPassForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            setTimeout(() => {
                showAlert("Request Sent", "Agar yeh User ID maujood hai, toh admin team aapse sampark karegi ya password reset link bhejegi.");
                document.getElementById('forgotPassModal').classList.remove('active');
                btn.innerHTML = 'Send Reset Link <i class="fas fa-paper-plane"></i>';
            }, 1500);
        });
    </script>

    <!-- 🔥 FIREBASE AUTHENTICATION LOGIC 🔥 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo0NKae4xEElyITxPyzKN0sdDaThyX5PA",
            authDomain: "dk-atovitt.firebaseapp.com",
            projectId: "dk-atovitt",
            storageBucket: "dk-atovitt.firebasestorage.app",
            messagingSenderId: "234274941441",
            appId: "1:234274941441:web:5e029c7ba315f849c3ae00"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Auto-Redirect
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace("auditionaccount.html");
            } else {
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 300);
                }
            }
        });

        function formatIdToEmail(userId) {
            return userId.trim().toLowerCase() + "@audition.dkatovitt.com";
        }

        // LOGIN PROCESS
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const userId = document.getElementById('loginUserId').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginSubmitBtn');
            const loginEmail = formatIdToEmail(userId);
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            signInWithEmailAndPassword(auth, loginEmail, pass)
                .catch((error) => {
                    showAlert("Login Failed", "Galat User ID ya Password. Kripya dubara try karein.", true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });

        // SIGNUP PROCESS
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('userIdStatus').classList.contains('status-taken')) {
                showAlert("Error", "Yeh User ID pehle se kisi ne liya hua hai. Kripya naya chunein.", true);
                return;
            }
            const userId = document.getElementById('signupUserId').value;
            const name = document.getElementById('signupName').value;
            const pass = document.getElementById('signupPassword').value;
            const confirmPass = document.getElementById('signupConfirmPassword').value;

            if(pass !== confirmPass) {
                showAlert("Error", "Dono passwords match nahi kar rahe hain!", true);
                return;
            }
            const btn = document.getElementById('signupSubmitBtn');
            const signupEmail = formatIdToEmail(userId);
            const originalText = btn.innerHTML;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Profile...';
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, signupEmail, pass)
                .then((userCredential) => {
                    updateProfile(userCredential.user, { displayName: name });
                })
                .catch((error) => {
                    let errorMsg = error.message;
                    if (error.code === 'auth/email-already-in-use') errorMsg = "Yeh User ID already registered hai. Kripya login karein.";
                    showAlert("Signup Failed", errorMsg, true);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
