<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - DK Atovitt</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-container { background: #141414; padding: 40px; border-radius: 12px; border: 1px solid #e6c875; box-shadow: 0 4px 20px rgba(0,0,0,0.8); width: 100%; max-width: 400px; }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { height: 60px; }
        .toggle-box { display: flex; justify-content: space-between; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .toggle-btn { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #888; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .toggle-btn.active { color: #e6c875; border-bottom: 2px solid #e6c875; margin-bottom: -2px; }
        
        .form-box { display: none; }
        .form-box.active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #e6c875; margin-bottom: 5px; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; background: #1f1f1f; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box; }
        .input-group input:focus { border-color: #e6c875; outline: none; }
        
        .submit-btn { background-color: #e6c875; color: #000; padding: 14px; width: 100%; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .submit-btn:hover { background-color: #d4b563; }
        
        .back-home { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .back-home:hover { color: #e6c875; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-box">
            <img src="images/logo/logo.png" alt="DK Atovitt">
        </div>
        
        <div class="toggle-box">
            <div class="toggle-btn active" onclick="switchTab('login')">Login</div>
            <div class="toggle-btn" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="form-box active" onsubmit="doLogin(event)">
            <div class="input-group">
                <label>Email or Username</label>
                <input type="text" required placeholder="Enter email or username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="submit-btn">Login to Account</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="form-box" onsubmit="doSignup(event)">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" required placeholder="Create a username">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" required placeholder="Enter mobile number">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" required placeholder="Enter email (OTP Verification later)">
            </div>
            <div class="input-group">
                <label>Create Password</label>
                <input type="password" required placeholder="Create a strong password">
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home Website</a>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-box').forEach(box => box.classList.remove('active'));
            
            if(tabName === 'login') {
                document.querySelectorAll('.toggle-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.toggle-btn')[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active');
            }
        }

        // Demo login/signup - Takes user to Dashboard
        function doLogin(e) { e.preventDefault(); window.location.href = "dashboard.html"; }
        function doSignup(e) { e.preventDefault(); alert("Account Created! Please Login."); switchTab('login'); }
    </script>
</body>
</html>
